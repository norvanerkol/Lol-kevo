name: LoL takip

on:
  schedule:
    - cron: "17 * * * *"     # yedek: döngü durursa saatte bir yeniden başlatır
  workflow_dispatch:         # elle başlatmak için "Run workflow" butonu

permissions:
  contents: write
  actions: write

concurrency:
  group: lol-takip
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Git ayarı
        run: |
          git config user.name "lol-takip-bot"
          git config user.email "lol-takip-bot@users.noreply.github.com"

      - name: Maç kontrolü (2 dakikada bir, ~5.5 saat)
        run: python3 check_game.py
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_ID: "tiltpr00f35#iwnl"
          NTFY_TOPIC: "lol-tilt-8172344e"
          PLATFORM: ${{ vars.PLATFORM || 'euw1' }}
          REGION: ${{ vars.REGION || 'europe' }}
          LOOP_MINUTES: "330"

      - name: Kendini yeniden başlat
        run: gh workflow run takip.yml --ref main -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
